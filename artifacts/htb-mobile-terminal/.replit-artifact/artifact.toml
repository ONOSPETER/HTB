kind = "mobile"
previewPath = "/"
title = "HTB Mobile Terminal"
description = "A mobile SSH terminal for manually connecting to authorized Hack The Box and CTF lab machines. Organizes workspaces, machines, and terminal sessions, with local command history and secure credential storage in the full native app."
version = "1.0.0"
id = "artifacts/htb-mobile-terminal"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 25977

[services.development]
run = "pnpm --filter @workspace/htb-mobile-terminal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/htb-mobile-terminal", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/htb-mobile-terminal", "run", "serve" ]

[services.env]
PORT = "25977"
BASE_PATH = "/"
